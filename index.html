<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flight Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Flight Plan</title>
<style>
  :root{
    --bg:#0b0f14; --surface:#111720; --head:#0d1928; --border:#1e2d42; --border2:#2a3f5c;
    --text:#cdd8e8; --dim:#6b7f96; --blue:#0077c8; --ual:#004b87; --gold:#c8a96e;
    --done:#00d4a0; --done-bg:rgba(0,212,160,.09);
    --wp:#f0a500; --wp-bg:rgba(240,165,0,.08);
    --ui:-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",Menlo,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{
    color:var(--text);font-family:var(--ui);font-size:13px;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
            max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  }
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
    border-bottom:2px solid var(--ual);padding-bottom:8px;margin-bottom:8px}
  .ref{font:9px var(--mono);color:var(--dim);letter-spacing:.06em;margin-bottom:3px}
  h1{font-size:22px;font-weight:800;color:#fff;letter-spacing:.06em;line-height:1}
  h1 span{color:var(--blue)}
  .sub{font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
  .badge{font-weight:800;font-size:13px;letter-spacing:.06em;color:#fff;background:var(--ual);padding:3px 10px;border-radius:3px}

  .tabs{display:flex;gap:8px;margin-bottom:8px}
  .tab{flex:1;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);background:var(--surface);
    border:1px solid var(--border2);border-radius:6px;padding:10px 8px;min-height:40px}
  .tab small{display:block;font:9px var(--mono);letter-spacing:.04em;font-weight:400;margin-top:2px}
  .tab[aria-selected="true"]{color:#fff;background:var(--head);border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--ual),var(--done));transition:width .3s}
  .count{font:11px var(--mono);color:var(--dim);min-width:58px;text-align:right}
  button{font-family:var(--ui);-webkit-tap-highlight-color:transparent;cursor:pointer}
  .btn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    background:none;border:1px solid var(--border2);border-radius:4px;padding:8px 14px;min-height:36px}
  .btn:active{color:#fff;border-color:var(--blue);background:rgba(0,119,200,.12)}

  .layout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
  .layout[hidden]{display:none}
  .col{display:flex;flex-direction:column;gap:10px;min-width:0}
    @media (max-width:640px){.layout{grid-template-columns:1fr}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .card.wp{border-color:var(--wp)}
  .ch{background:var(--head);border-bottom:1px solid var(--border);padding:7px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .wp .ch{background:var(--wp-bg);border-bottom-color:rgba(240,165,0,.3)}
  .ct{font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
  .wp .ct{color:var(--wp)}
  .sh{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    padding:5px 10px 4px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.025)}
  .lead{font-size:12px;font-style:italic;color:var(--text);padding:8px 10px;border-bottom:1px solid var(--border)}
  .wpbtn{font:700 10px var(--mono);letter-spacing:.05em;color:var(--wp);background:none;
    border:1px solid rgba(240,165,0,.45);border-radius:4px;padding:7px 10px;min-height:32px}
  .wpbtn:active{background:rgba(240,165,0,.18)}
  .rbtn{font:700 10px var(--mono);letter-spacing:.05em;color:var(--dim);background:none;
    border:1px solid var(--border2);border-radius:4px;padding:7px 10px;min-height:32px}
  .rbtn:active{color:#fff;border-color:var(--blue);background:rgba(0,119,200,.15)}

  .item{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:36px;cursor:pointer;
    border-bottom:1px solid rgba(30,45,66,.6);-webkit-tap-highlight-color:transparent}
  .item.l1{padding-left:26px}
  .item.l2{padding-left:42px}
  .item:active{background:rgba(255,255,255,.05)}
  .item.done{background:var(--done-bg)}
  .wp .item.done{background:var(--wp-bg)}
  .box{width:18px;height:18px;min-width:18px;border:1.5px solid var(--border2);border-radius:3px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
  .box svg{display:none}
  .item.done .box{background:var(--done);border-color:var(--done)}
  .wp .item.done .box{background:var(--wp);border-color:var(--wp)}
  .item.done .box svg{display:block}
  .txt{flex:1;line-height:1.3}
  .act{font:10px var(--mono);color:var(--gold);text-align:right;white-space:nowrap;flex-shrink:0}
  .act:empty{display:none}
  .wp .act{color:var(--wp)}
  .item.done .txt,.item.done .act{color:var(--dim)}
  .item.done .txt{text-decoration:line-through;text-decoration-color:rgba(0,212,160,.4)}
  .wp .item.done .txt{text-decoration-color:rgba(240,165,0,.4)}
  .note{font-size:10px;color:var(--wp);padding:6px 10px;background:rgba(240,165,0,.04);border-top:1px solid rgba(240,165,0,.2)}
  .note.plain{color:var(--text);font-size:11px;font-style:italic;background:rgba(255,255,255,.03);border-top:1px solid var(--border)}
  .note.plain b{font-style:normal}

  table.dev{width:100%;border-collapse:collapse;font-size:12px;margin:0}
  table.dev th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--head);
    padding:6px 8px;border:1px solid var(--border);text-align:center}
  table.dev td{padding:7px 8px;border:1px solid var(--border);text-align:center;color:var(--text)}
  table.dev td.trk{color:var(--gold);font-family:var(--mono);font-size:11px}
  .src{font:9px var(--mono);color:var(--dim);text-align:right;padding:6px 10px;border-top:1px solid var(--border)}
  footer{margin-top:12px;text-align:center;font:9px var(--mono);color:var(--dim);letter-spacing:.04em;line-height:1.6}

  /* ===== FIT-TO-SCREEN (iPad Pro 11" landscape, no scroll) ===== */
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;gap:6px;height:100vh;height:100dvh;
    padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border-bottom:2px solid var(--ual);padding-bottom:5px;flex:none}
  .brand{flex:none}
  .ref{font:8px var(--mono);margin:0 0 1px}
  h1{font-size:17px}
  .tabs{display:flex;gap:6px;margin:0;flex:none}
  .tab{flex:none;min-height:34px;padding:4px 14px;font-size:11px}
  .tab small{display:inline;margin-left:6px;font-size:9px}
  .bar{flex:1 1 24px;margin:0;min-width:0}
  .btn{padding:6px 10px;min-height:32px;font-size:10px}
  .layout{flex:1;min-height:0;font-size:var(--fs,12px);gap:.6em;overflow:hidden}
  .layout[hidden]{display:none}
  .col{gap:.6em}
  .layout .ch{padding:.35em .6em}
  .layout .ct{font-size:.82em}
  .layout .sh{font-size:.72em;padding:.25em .7em}
  .layout .lead{font-size:1em;padding:.3em .7em}
  .layout .item{padding:.18em .6em;min-height:0;gap:.55em}
  .layout .item.l1{padding-left:1.8em}
  .layout .item.l2{padding-left:3em}
  .layout .box{width:1.35em;height:1.35em;min-width:1.35em}
  .layout .txt{line-height:1.2}
  .layout .act{font-size:.82em}
  .layout .note{font-size:.82em;padding:.3em .7em}
  .layout .note.plain{font-size:.9em}
  .layout .src{font-size:.75em;padding:.2em .7em}
  .layout .wpbtn,.layout .rbtn{font-size:.78em;padding:.4em .6em;min-height:28px}
  .layout table.dev{font-size:.95em}
  .layout table.dev th,.layout table.dev td{padding:.25em .5em}
  footer{flex:none;margin:0;font-size:8px;line-height:1.2}
  @media (max-width:640px){.layout{overflow:auto}}
  .idxb{margin-left:auto;flex:none;font:700 10px var(--mono);letter-spacing:.08em;padding:7px 12px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;text-transform:uppercase}
  .idxb + .pill{margin-left:0}
  #idxov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end}
  #idxov[hidden]{display:none !important}
  #idxov .sheet{width:min(440px,100%);background:var(--surface);border-left:1px solid var(--border2);padding:16px calc(16px + env(safe-area-inset-right,0px)) 24px 16px;overflow:auto}
  #idxov h2{margin:0 0 4px;font-size:18px}
  #idxov .sub{margin:0 0 12px;color:var(--dim);font-size:13px}
  #idxov .grp{margin:14px 0 6px;font:700 11px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
  #idxov .grp b{color:var(--ual)}
  #idxov .row{display:flex;flex-wrap:wrap;gap:8px}
  #idxov .it{border:1px solid var(--border2);background:var(--bg);color:var(--text);border-radius:10px;padding:12px 14px;min-width:110px;font:600 14px/1.2 inherit;text-align:left;cursor:pointer}
  #idxov .it[disabled]{opacity:.4}
  #idxov .it small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:3px}
  #idxov .xb{float:right;border:1px solid var(--border2);background:none;color:var(--dim);border-radius:8px;padding:6px 10px;cursor:pointer}
  .pill{margin-left:auto;flex:none;font:700 10px var(--mono);letter-spacing:.08em;padding:7px 10px;border-radius:999px;
    border:1px solid var(--border2);color:var(--dim);white-space:nowrap}
  .pill::before{content:"\25CF";margin-right:6px}
  .pill.wait{color:var(--wp);border-color:rgba(240,165,0,.5)}
  .pill.ok{color:var(--done);border-color:rgba(0,212,160,.6);background:var(--done-bg)}
  .pill.bad{color:#ff6b6b;border-color:rgba(255,107,107,.6)}

  /* ===== STAGE MANAGER / ANY WINDOW SIZE ===== */
  .layout.c3{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
  .layout.c2{display:block;columns:2;column-gap:.7em;column-fill:auto;overflow:hidden}
  .layout.c2 .col{display:contents}
  .layout.c2 .card{break-inside:avoid;margin-bottom:.7em}
  .layout.c1{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .layout.c1 .col{margin-bottom:.7em}
  .layout.c1 .item,.layout.c2 .item{padding-top:.3em;padding-bottom:.3em}
  .layout.c1 .item{padding-top:.5em;padding-bottom:.5em;min-height:40px}
  @media (max-width:760px){
    .top{gap:6px 8px}
    .ref,.tabs .tab small{display:none}
    .tab{padding:4px 12px}
  }
  @media (max-width:1300px){.tabs .tab small{display:none}}
  .layout[hidden]{display:none !important}
  * {touch-action:manipulation}
  /* paged mode (narrow windows): one section at a time + chip bar */
  .chips{display:none;flex:none;gap:6px;overflow-x:auto}
  body.paged .chips{display:flex}
  .chips[hidden]{display:none !important}
  .chip{flex:1 0 auto;min-height:44px;padding:4px 10px;border:1px solid var(--border2);border-radius:6px;
    background:var(--surface);color:var(--dim);font:700 11px var(--ui);text-align:center;letter-spacing:.04em}
  .chip small{display:block;font:9px var(--mono);margin-top:2px;letter-spacing:0}
  .chip.full{color:var(--done);border-color:rgba(0,212,160,.5)}
  .chip.isWp{border-color:rgba(240,165,0,.6);color:var(--wp)}
  .chip.on{color:#fff;background:var(--head);border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
  .layout.c1 .card:not(.on){display:none}
  .layout:not(.c1) #card-cbg2 .ch{display:none}
  .layout:not(.c1) #card-cbg{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:-.6em}
  .layout:not(.c1) #card-cbg2{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
  .layout.c1 .item{padding-top:.4em;padding-bottom:.4em;min-height:34px}

  /* ===== NAV + PREFLIGHT / INFLIGHT VIEWS ===== */
  :root{--dng-bg:rgba(220,53,69,.14);--dng-bd:#c0392b;--dng-fg:#ff8a8a;--acc-bg:rgba(0,119,200,.16);--acc-bd:rgba(0,119,200,.55);--acc-fg:#7cc7ff}
  .mainnav{display:flex;gap:6px;flex:none;border-top:1px solid var(--border);padding-top:6px}
  .mainnav .tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;letter-spacing:.05em}
  .mainnav .tab small{display:block;margin:2px 0 0;font:9px var(--mono);letter-spacing:.03em;font-weight:400;color:var(--dim)}
  .mainnav .tab[aria-selected="true"] small{color:#9fc9ee}
  .mainnav .tab[aria-selected="true"]{background:#0b2a47;border-color:#2b9bf0;color:#fff}
  .fbar{display:flex;gap:16px;align-items:flex-end;margin-left:auto;flex-wrap:wrap}
  .fb{display:flex;flex-direction:column;gap:1px}
  .fb span{font:700 9px var(--mono);letter-spacing:.12em;color:var(--dim)}
  .fb b{font:700 16px var(--mono);color:#fff;white-space:nowrap}
  .fb:first-child b{font-size:20px;letter-spacing:.04em}
  .fb b.dim{color:var(--dim)}
  .flt{display:none !important}
  #view-nav{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:6px;background:#0b1118}
  #view-nav[hidden]{display:none !important}
  .ofpfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .ofpbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--border2);border-radius:8px;padding:10px 12px}
  .ofpbar .ofptx{flex:1;min-width:200px}
  .ofpbar .ofpt{font-weight:700;font-size:14px;color:#fff}
  .ofpbar .ofps{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.3}
  .ofpbar .ofps.ok{color:var(--done)}
  .ofpbar .ofps.err{color:#ff9b9b}
  @media (max-width:760px){.fbar{gap:10px;margin-left:0;width:100%}.fb b{font-size:13px}.fb:first-child b{font-size:16px}.mainnav .tab small{display:none}.mainnav .tab{font-size:11px;padding:4px 2px}}
  .orcatools{display:contents}
  .orcatools[hidden]{display:none !important}
  #view-orca{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  #view-orca[hidden]{display:none !important}
  .view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px;align-content:start;align-items:start;padding-bottom:6px}
  .view[hidden]{display:none !important}
  .view .full{grid-column:1/-1}
  .pnote{font-size:11px;color:var(--wp);background:var(--wp-bg);border:1px solid rgba(240,165,0,.3);border-radius:6px;padding:8px 10px}
  .wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
  .warn{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.5);color:#ff9b9b;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.3}
  .warn[hidden]{display:none !important}
  .body{padding:10px;display:flex;flex-direction:column;gap:10px}
  .fl{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fl>span{font:700 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .in{width:100%;min-width:0;min-height:44px;background:var(--bg);color:var(--text);border:1px solid var(--border2);border-radius:6px;
    padding:8px 10px;font:16px var(--ui);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
  .in:focus{outline:2px solid var(--blue);outline-offset:0}
  select.in{padding-right:30px;background-repeat:no-repeat;background-position:right 10px center;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7f96' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
  .wrap[hidden],.flt[hidden]{display:none}
  .sub{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .altbody{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:end;padding:8px}
  .posrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:8px 8px 0}
  .posbtns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cpb .row2:not(.cpbody){padding:8px 8px 0}
  .posrow .btn{min-height:44px}
  .fl.req span{color:#f0c36d;font-weight:800}
  .in.req{background:#2a2210;border:2px solid #f0c36d;color:#fff;font-weight:700}
  .etp{display:contents}
  .etp[hidden]{display:none !important}
  .etpnav{display:flex;gap:8px;flex-wrap:wrap}
  .etpnav .btn{flex:1;min-width:140px}
  .etpnav .btn[aria-pressed="true"]{background:#0b2a47;border-color:#2b9bf0;color:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border-radius:6px;padding:10px 12px;border:1px solid var(--border2);background:var(--head);min-width:0}
  .tile .tl{font-size:12px;line-height:1.2}
  .tile .tv{font-size:24px;font-weight:800;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
  .tile.acc{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc-fg)}
  .tile.neu{color:#fff}
  .tile.neu .tl{color:var(--dim)}
  .tile.dng{background:var(--dng-bg);border-color:var(--dng-bd);color:var(--dng-fg)}
  .hint{font-size:11px;color:var(--dim);line-height:1.35}
  .tile .hint{margin-top:2px}
  .src2{font:9px var(--mono);color:var(--dim);border-top:1px solid var(--border);padding-top:8px}
  .msg{font-size:12px;color:#ff9b9b}
  .msg[hidden],.hint[hidden]{display:none !important}
  .tag{font:700 11px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--border2);color:var(--dim);white-space:nowrap}
  .tag.pos{color:var(--done);border-color:rgba(0,212,160,.5);background:var(--done-bg)}
  .tag.neg{color:#ff6b6b;border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.08)}
  .btn.big{min-height:44px;font-size:11px;padding:8px 14px}
  .dtab{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
  .dtab th,.dtab td{border:1px solid var(--border2);padding:8px 6px;text-align:center;vertical-align:middle;line-height:1.25}
  .dtab thead th{background:var(--head);color:#fff;font-size:16px}
  .dtab th.rl{text-align:left;color:#fff;background:var(--head)}
  .dtab td{color:var(--text,#cdd8e8)}
  .dtab td small{display:block;color:var(--dim)}
  .dnote{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  #preBrief[hidden]{display:none !important}
  .preseg{display:flex;gap:8px}
  .preseg .btn{flex:1;min-height:48px;font-size:13px}
  .preseg .btn[aria-pressed="true"]{background:#0b2a47;border-color:#2b9bf0;color:#fff}
  .btn.on{color:#fff;border-color:var(--wp);background:var(--wp-bg)}
  .dbtn{min-height:44px;font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dng-fg);background:none;
    border:1px solid var(--dng-bd);border-radius:6px;padding:8px 14px}
  .dbtn:active{background:rgba(255,107,107,.15)}
  .dbtn.small{min-height:36px;padding:4px 10px;font-size:10px}
  .dbtn.armed{background:rgba(255,107,107,.2);color:#fff}
  .cplist{display:flex;flex-direction:column;gap:10px}
  .cpb{border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.02)}
  .cph{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .cph b{font:700 12px var(--mono);color:var(--blue);letter-spacing:.06em}
  .cph .tag{margin-left:auto}
  .cpbody{padding:8px}
  .edited{font:10px var(--mono);color:var(--dim)}
  .eorow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}
  .eolab{font:700 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .hfcard{container-type:inline-size}
  .hfrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
  .hfn{font:700 13px var(--mono);color:var(--blue);width:1.2em;text-align:center}
  .hfsw{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
  .hfat{font:700 14px var(--mono);color:var(--dim);width:1.2em;text-align:center}
  @container (min-width:760px){
    .hfrow{grid-template-columns:auto 1fr 1fr auto 1.7fr}
    .hfsw{display:contents}
  }
  .view .card{overflow:visible}
  .mainnav .tab{padding-left:10px;padding-right:10px}
  .tile .tv.pos{color:var(--done)}
  .tile .tv.neg{color:#ff6b6b}
  .ladder{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--border2);padding-left:10px}
  .rung{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center}
  .rl{font:700 13px var(--mono);letter-spacing:.08em;color:var(--blue)}
  .flt{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
  .newflt{margin-top:18px;padding-top:14px;border-top:1px solid var(--border2);display:flex;flex-direction:column;gap:8px}
  .flt span{font:700 12px var(--mono);letter-spacing:.1em;color:var(--text)}
  .flt input{width:140px;min-height:40px;background:#16233a;color:#fff;border:2px solid #f0c36d;border-radius:8px;
    padding:4px 10px;font:800 22px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;
    box-shadow:0 0 10px rgba(240,195,109,.25);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
  .flt input::placeholder{color:#8da2bd;font-weight:500;font-size:14px;text-transform:none;letter-spacing:0}
  .flt input:focus{outline:2px solid var(--blue)}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="ref" id="ref">FM 2602</div>
    <h1>FLIGHT <span>PLAN</span></h1>
  </div>
  <div class="orcatools" id="orcatools">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab0" aria-selected="true">PAGE 1 <small>4.10.4 Checklist</small></button>
      <button class="tab" role="tab" id="tab1" aria-selected="false">PAGE 2 <small>4.10.5 General</small></button>
    </div>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>
  <div class="fbar" id="fbar" aria-label="Flight summary">
    <div class="fb"><span>FLIGHT</span><b id="fbNo">--</b></div>
    <div class="fb"><span>ROUTE</span><b id="fbRt">---- &rarr; ----</b></div>
    <div class="fb fbac"><span>AIRCRAFT</span><b id="fbAc">--</b></div>
    <div class="fb"><span>OUT</span><b id="fbOut">----</b></div>
    <div class="fb"><span>OFF</span><b id="fbOff">----</b></div>
    <div class="fb"><span>ON</span><b id="fbOn">----</b></div>
    <div class="fb"><span>IN</span><b id="fbIn">----</b></div>
  </div>
  <label class="flt"><span>INFO</span><input id="flt" type="text" maxlength="12" placeholder="---" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Flight info"></label>
  <button class="idxb" id="idxBtn" aria-label="Index of all pages">&#9776; Index</button>
  <div class="pill wait" id="status" role="status">CHECKING…</div>
</div>

<div id="view-orca">
<div class="layout" id="p0"></div>
<div class="layout" id="p1" hidden></div>
</div>
<div class="view" id="view-pre" hidden></div>
<div id="view-nav" hidden></div>
<div class="view" id="view-in" hidden></div>
<div class="view" id="view-fuel" hidden></div>
<div class="view" id="view-new" hidden></div>

<footer id="foot">Reference aid only. Verify against current FM 2602 (17 APR 26). Progress saves on this device.</footer>
<nav class="mainnav" role="tablist" aria-label="Section">
  <button class="tab" role="tab" id="nav-pre" aria-selected="true">Preflight<small>PDF &middot; flight &middot; FMS</small></button>
  <button class="tab" role="tab" id="nav-nav" aria-selected="false">Nav Log<small>fix by fix</small></button>
  <button class="tab" role="tab" id="nav-fuel" aria-selected="false">Fuel<small>bingo</small></button>
  <button class="tab" role="tab" id="nav-new" aria-selected="false">ETOPS<small>alt &middot; CPs</small></button>
  <button class="tab" role="tab" id="nav-in" aria-selected="false">Inflight<small>cruise</small></button>
</nav>

<script src="navlog-ui.js"></script>
<script>
(function(){
  "use strict";

  // ───────── DATA ─────────
  // To edit: change text here. Keep item ORDER stable within a section or saved checks will shift.
  // Item: [text, action, indent]   indent: 1 = sub-item, 2 = sub-sub-item
  // Section: id, title, items | groups:[{id,sub,items}], optional lead, note, table, reset, wp
  var PAGES = [
    { ref:"FM 2602 · 4.10.4 · ORCA OPERATIONS · 17 APR 26", cols:[
      [
        {id:"ppd", title:"Preflight Planning & Dispatch", items:[
          ["Briefing package","Review"],
          ["Dispatch Release","Review",1],
          ["Master Flight Log/Plan","Designate",1],
          ["ATC filing","Review",1],
          ["Track message","Review",1],
          ["ETOPS critical fuel analysis","Review",1],
          ["Weather and NOTAMs","Check",1],
          ["Orientation Chart","Complete"],
          ["Dispatch briefing","As required"]
        ]},
        {id:"pp", title:"Preflight Procedures", items:[
          ["Aircraft maintenance status","Review"],
          ["FMC route","Uplink/load"],
          ["Independent route verification","Complete"],
          ["Route distance","Confirm",1],
          ["Crew verification of Class II","Complete"],
          ["7-character L/L waypoints","Expand",1],
          ["Class II waypoints","Circle",1],
          ["Oceanic clearance","Confirm, slash",1],
          ["Route copy","Consider"],
          ["HF reception check","Complete"],
          ["Documents","Check"],
          ["Lav/water service","Verify"]
        ]}
      ],
      [
        {id:"enr", title:"Enroute Prior To / Entry Into ORCA", items:[
          ["CPDLC","Log on"],
          ["ETOPS alternate weather","Check OK"],
          ["Wind update","Complete"],
          ["Desired Mach and altitude","Determine"],
          ["Oceanic clearance","As required"],
          ["Oceanic clearance verify","Complete"],
          ["Assigned Mach","Maintain"],
          ["LNAV/VNAV","Confirm"],
          ["Altitude and RVSM","Check"],
          ["Nav accuracy","Verify"],
          ["RNP","Verify/set 4.0"],
          ["Master Flight Log/Plan","Check"],
          ["HF/SELCAL","Complete"],
          ["VNAV page","Review/set STEP"],
          ["RTE 2","Program as desired"],
          ["FIX page","Program as desired"],
          ["ALTN page","Program as desired"]
        ]},
        {id:"est", title:"Established in ORCA", items:[
          ["VHF radios","Set"],
          ["SLOP","Apply"],
          ["Transponder","Set"],
          ["FIR boundary POS REPORT","As required"]
        ]},
        {id:"exit", title:"Exiting ORCA", items:[
          ["SLOP and manual RNP","Remove"],
          ["Routing","Confirm"],
          ["Mach","Request or maintain"],
          ["Desired altitude","Request"]
        ]}
      ],
      [
        {id:"wp", wp:true, title:"Waypoint Procedures", groups:[
          {sub:"Approaching Waypoint (~30 NM)", id:"wa", items:[
            ["Assigned Mach","Confirm"],
            ["LNAV/VNAV","Confirm"],
            ["Altitude and RVSM","Check"],
            ["Next waypoint (course, distance)","Verify"]
          ]},
          {sub:"At Waypoint", id:"wb", items:[
            ["Aircraft turns to correct outbound course","Confirm"],
            ["FMC POS REPORT","Monitor/downlink"],
            ["2nd slash on waypoint passed","Annotate"],
            ["ATA/FUEL/ETA","Annotate"],
            ["ATC POS report","Transmit, as req."]
          ]},
          {sub:"After Waypoint Passage (10 min)", id:"wc", items:[
            ["Nav accuracy","Verify"],
            ["ETA for next waypoint","Compare"]
          ]}
        ], note:"Repeat at each waypoint. Tap NEXT WPT to clear this card."},
        {id:"add", title:"Additional Considerations", items:[
          ["ETOPS MX verification flight","If applicable"],
          ["Ground delay/return to gate","If applicable"],
          ["Revised Clearance Guide","If applicable"],
          ["Fuel freeze analysis","If applicable"],
          ["TCDP for route","If applicable"]
        ]}
      ]
    ]},

    { ref:"FM 2602 · 4.10.5 · ORCA OPERATIONS GENERAL · 17 APR 26", cols:[
      [
        {id:"rcg", title:"Revised Clearance Guide", reset:true,
         lead:"A new Class II/oceanic clearance has been issued.",
         items:[
          ["Print new oceanic clearance. If received via voice, record on MFP or MFL."],
          ["Compare new clearance with filed/expected clearance (or optional track) and track message, as appropriate. Note changes in assigned route or organized track, waypoints, altitudes, and speeds as applicable."],
          ["Load new route into FMC. Independently verify entries are correct."],
          ["Accomplish waypoint verification procedures."],
          ["Obtain revised domestic clearance, as required, to new oceanic entry point."],
          ["Comply with revised altitudes and/or speeds as appropriate prior to entry point."],
          ["Advise Dispatch of new route and request updated Flight Plan."],
          ["Program critical points and ETOPS alternates in FMC as required."],
          ["Update winds."],
          ["Plot new route on Orientation Chart, labeling CPs, ETOPS alternates, and other information as required. Strike through old route."]
         ],
         plain:"<b>Note:</b> Prior to oceanic exit point, obtain and program revised domestic clearance as applicable."}
      ],
      [
        {id:"cbg", title:"ORCA Contingency Briefing Guide", reset:true, groups:[
          {sub:"Emergency Descent (e.g., Rapid Depressurization)", id:"cb1", items:[
            ["CABIN ALTITUDE QRC – Review"],
            ["TCDP routes and grid MORA – Review"],
            ["Offset – Determine dir/dist (L/R 5), LNAV"]
          ]},
          {sub:"Driftdown (e.g., Engine Failure)", id:"cb2", items:[
            ["Threats"],
            ["Traffic (e.g., Atlantic tracks)","",2],
            ["Terrain","",2],
            ["Volcanic ash/weather","",2],
            ["Distant alternate (fuel considerations)","",2],
            ["Offset – Determine dir/dist (L/R 5), LNAV"],
            ["FMC EO SPD _____ and ALT _____ – Review diff from cruise speed and altitude"],
            ["ENG QRC (Severe Damage, Surge/Stall) – Review"],
            ["DRIFTDOWN QRC – Review Card"],
            ["END Driftdown – Transition to IDLE descent (e.g., offset 5 NM + clear of threat)"]
          ]}
        ]},
        {id:"cbg2", title:"ORCA Contingency Briefing Guide (cont.)", reset:true, groups:[
          {sub:"Emergency can maintain altitude (e.g., Cargo Fire)", id:"cb3", items:[
            ["Offset – Determine dir/dist (L/R 5), LNAV"],
            ["Altitude – Review change +/- 500 feet once offset 5 NM (1000 feet if above FL 410)"],
            ["Speed – As required"]
          ]},
          {sub:"Contingency Comm Plan", id:"cb4", items:[
            ["Clearance – Obtain if able (VHF, SATCOM, HF)"],
            ["Intentions – Broadcast on 121.5 and 123.45"],
            ["CPDLC emergency report – SEND"],
            ["Exterior lights – ON"],
            ["Squawk – 7700"]
          ]}
        ]},
        {id:"rdp", title:"Redispatch Procedures", reset:true, groups:[
          {sub:"Within two hours of redispatch point", id:"rd1", items:[
            ["[PM] Redispatch procedures – Initiate"],
            ["[PM] Fuel remaining at redispatch point – Project and relay to NOC"]
          ]},
          {sub:"If redispatch acceptable", id:"rd2", items:[
            ["[C, F] ACARS redispatch message – RDA"]
          ]},
          {sub:"If redispatch not acceptable", id:"rd3", items:[
            ["[C, F] ACARS redispatch message – RDU"]
          ]},
          {sub:"If diverting to refueling airport", id:"rd4", items:[
            ["[C, F] New ATC clearance – Coordinate"]
          ]}
        ]}
      ],
      [
        {id:"pcb", title:"Pilot Change Brief", reset:true, items:[
          ["Position/flight level/SLOP"],
          ["Clearance/impending CLNC/route changes"],
          ["CPDLC/ADS-C status"],
          ["Radio frequencies/ATC controller"],
          ["Enroute weather/turbulence"],
          ["Diversion/landing airport status"],
          ["Redispatch WX and status"],
          ["Aircraft, cabin, and pax status"],
          ["Mach/cost index (CI)"],
          ["Routing and STEP/RECMD altitudes"],
          ["Fuel score/CP/redispatch fuel"],
          ["In Captain's absence, designate acting Captain"],
          ["Contingencies – Consider briefing applicable contingencies in center column"]
        ]},
        {id:"wxd", title:"Weather Deviation", reset:true, groups:[
          {sub:"If unable to obtain clearance", id:"wd1", items:[
            ["Deviation < 5 NM – Maintain cleared FL"],
            ["Deviation ≥ 5 NM – Climb/descend 300 feet"],
            ["Exterior lights – ON"],
            ["Intentions – Broadcast on 121.5 and 123.45"]
          ]}
        ], table:{
          head:["Track","Direction","Level Change"],
          rows:[
            ["000-179 Magnetic", [["Left","Descend 300 feet"],["Right","Climb 300 feet"]]],
            ["180-359 Magnetic", [["Left","Climb 300 feet"],["Right","Descend 300 feet"]]]
          ]
        }, src:"756-4-053b"}
      ]
    ]}
  ];

  // ───────── STATE (localStorage, fails safe) ─────────
  var KEY = "orca-checklist-v1";
  var state = {}, wpCount = 0, tab = 0, active = [0,0];
  try{
    var raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    state = raw.s || {}; wpCount = raw.w || 0; tab = raw.t || 0; if(raw.c) active = raw.c;
  }catch(e){}
  if(tab !== 0 && tab !== 1) tab = 0;
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({s:state, w:wpCount, t:tab, c:active})); }catch(e){}
  }

  // ───────── RENDER ─────────
  var CHECK = '<svg width="11" height="9" viewBox="0 0 9 7" fill="none"><polyline points="1,3.5 3.5,6 8,1" stroke="#0b0f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }

  function itemEl(secId, i, it){
    var id = secId + "." + i;
    var d = el("div", "item" + (it[2] === 1 ? " l1" : it[2] === 2 ? " l2" : "") + (state[id] ? " done" : ""));
    d.dataset.id = id;
    d.innerHTML = '<div class="box">'+CHECK+'</div><span class="txt"></span><span class="act"></span>';
    d.querySelector(".txt").textContent = it[0];
    d.querySelector(".act").textContent = it[1] || "";
    return d;
  }

  function deviationTable(t){
    var tb = el("table", "dev");
    var h = "<tr>" + t.head.map(function(x){ return "<th>" + x + "</th>"; }).join("") + "</tr>";
    var body = "";
    t.rows.forEach(function(r){
      r[1].forEach(function(line, k){
        body += "<tr>" + (k === 0 ? '<td class="trk" rowspan="' + r[1].length + '">' + r[0] + "</td>" : "") +
                "<td>" + line[0] + "</td><td>" + line[1] + "</td></tr>";
      });
    });
    tb.innerHTML = h + body;
    return tb;
  }

  var wpCountEl;
  PAGES.forEach(function(pg, pi){
    var layout = document.getElementById("p" + pi);
    pg.cols.forEach(function(col){
      var c = el("div", "col");
      col.forEach(function(sec){
        var card = el("section", "card" + (sec.wp ? " wp" : ""));
        card.id = "card-" + sec.id;
        var h = el("div", "ch");
        h.appendChild(el("span", "ct", sec.title));
        if(sec.wp){
          var b = el("button", "wpbtn"); b.id = "wpReset";
          b.innerHTML = 'NEXT WPT <span id="wpn"></span> ↺';
          h.appendChild(b);
        }else if(sec.reset){
          var r = el("button", "rbtn", "RESET ↺");
          r.dataset.reset = sec.id;
          h.appendChild(r);
        }
        card.appendChild(h);
        if(sec.lead) card.appendChild(el("div", "lead", sec.lead));
        if(sec.groups){
          sec.groups.forEach(function(g){
            card.appendChild(el("div", "sh", g.sub));
            g.items.forEach(function(it,i){ card.appendChild(itemEl(g.id,i,it)); });
          });
        }else{
          sec.items.forEach(function(it,i){ card.appendChild(itemEl(sec.id,i,it)); });
        }
        if(sec.table) card.appendChild(deviationTable(sec.table));
        if(sec.note) card.appendChild(el("div", "note", sec.note));
        if(sec.plain){ var p = el("div", "note plain"); p.innerHTML = sec.plain; card.appendChild(p); }
        if(sec.src) card.appendChild(el("div", "src", sec.src));
        c.appendChild(card);
      });
      layout.appendChild(c);
    });
  });
  wpCountEl = document.getElementById("wpn");

  var SHORT = {ppd:"Planning",pp:"Preflight",enr:"Enroute",est:"Established",exit:"Exit",wp:"Waypoint",add:"Add\u2019l",
               rcg:"Clearance",cbg:"Descent/Drift",cbg2:"Alt/Comm",rdp:"Redispatch",pcb:"Pilot Change",wxd:"Weather"};
  var cards = [], chips = [];
  PAGES.forEach(function(pg, pi){
    var L = document.getElementById("p" + pi);
    cards[pi] = Array.prototype.slice.call(L.querySelectorAll(".card"));
    var bar = el("div", "chips"); bar.hidden = true;
    cards[pi].forEach(function(c, k){
      var id = c.id.replace("card-", "");
      var b = el("button", "chip" + (id === "wp" ? " isWp" : ""));
      b.dataset.k = k;
      b.textContent = SHORT[id];
      bar.appendChild(b);
    });
    L.parentNode.insertBefore(bar, L);
    chips[pi] = bar;
  });
  for(var q = 0; q < 2; q++){ if(!(active[q] >= 0 && active[q] < cards[q].length)) active[q] = 0; }

  // ───────── BEHAVIOR ─────────
  var pages = [document.getElementById("p0"), document.getElementById("p1")];
  var tabs  = [document.getElementById("tab0"), document.getElementById("tab1")];

  function $orca(){ return document.getElementById("view-orca"); }
  // Pick the best layout for this window: 3 columns, else 2, else 1 (scrolls).
  function setMode(L,m){ L.classList.remove("c1","c2","c3"); L.classList.add(m); }
  function over(L,m){
    return m === "c2" ? L.scrollWidth > L.clientWidth + 1 : L.scrollHeight > L.clientHeight + 1;
  }
  function tryFit(L,m,max,min){
    setMode(L,m);
    var fs = max; L.style.setProperty("--fs", fs + "px");
    while(fs > min && over(L,m)){ fs -= 0.25; L.style.setProperty("--fs", fs + "px"); }
    return !over(L,m);
  }
  function fit(){
    if($orca().hidden) return;
    var L = pages[tab]; if(!L) return;
    var w = window.innerWidth;
    document.body.classList.remove("paged");
    if(w >= 900 && tryFit(L,"c3",15,9.5)) return;
    if(w >= 460 && tryFit(L,"c2",15,9.5)) return;
    setMode(L,"c1");
    document.body.classList.add("paged");
    var fs = 15; L.style.setProperty("--fs", fs + "px");
    while(fs > 10 && L.scrollHeight > L.clientHeight + 1){ fs -= 0.25; L.style.setProperty("--fs", fs + "px"); }
  }

  function setActive(pi, k){
    active[pi] = k;
    cards[pi].forEach(function(c, i){ c.classList.toggle("on", i === k); });
    Array.prototype.forEach.call(chips[pi].children, function(b, i){ b.classList.toggle("on", i === k); });
  }

  function updateChips(){
    cards.forEach(function(list, pi){
      list.forEach(function(c, k){
        var n = c.querySelectorAll(".item").length, d = c.querySelectorAll(".item.done").length;
        var b = chips[pi].children[k];
        b.classList.toggle("full", n > 0 && d === n);
      });
    });
  }

  function showTab(n){
    tab = n;
    pages.forEach(function(p,i){ p.hidden = (i !== n); });
    tabs.forEach(function(t,i){ t.setAttribute("aria-selected", i === n ? "true" : "false"); });
    document.getElementById("ref").textContent = PAGES[n].ref;
    chips.forEach(function(c,i){ c.hidden = (i !== n); });
    setActive(n, active[n]);
    progress(); fit();
  }

  function progress(){
    var cur = pages[tab];
    var all = cur.querySelectorAll(".item").length;
    var done = cur.querySelectorAll(".item.done").length;
    document.getElementById("fill").style.width = (all ? done/all*100 : 0) + "%";
    if(wpCountEl) wpCountEl.textContent = "#" + (wpCount + 1);
    updateChips();
  }

  function clear(scope){
    scope.querySelectorAll(".item.done").forEach(function(e){
      e.classList.remove("done"); delete state[e.dataset.id];
    });
  }

  chips.forEach(function(bar, pi){
    bar.addEventListener("click", function(e){
      var b = e.target.closest(".chip"); if(!b) return;
      setActive(pi, +b.dataset.k); fit(); save();
    });
  });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

  tabs.forEach(function(t,i){ t.addEventListener("click", function(){ showTab(i); save(); }); });

  document.addEventListener("click", function(e){
    var rb = e.target.closest("[data-reset]");
    if(rb){
      clear(document.getElementById("card-" + rb.dataset.reset));
      if(rb.dataset.reset === "cbg" && !document.body.classList.contains("paged")) clear(document.getElementById("card-cbg2"));
      save(); progress(); return;
    }
    var el_ = e.target.closest(".item");
    if(!el_) return;
    var id = el_.dataset.id;
    if(state[id]){ delete state[id]; el_.classList.remove("done"); }
    else { state[id] = 1; el_.classList.add("done"); }
    save(); progress();
  });

  document.getElementById("wpReset").addEventListener("click", function(){
    clear(document.getElementById("card-wp"));
    wpCount++; save(); progress();
  });

  // Used by the global Reset All (second script below).
  window.orcaResetChecks = function(){ pages.forEach(clear); wpCount = 0; save(); progress(); };

  showTab(tab);
  window.addEventListener("resize", fit);
  window.addEventListener("orcashown", function(){
    document.getElementById("ref").textContent = PAGES[tab].ref;
    fit();
  });
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 200); });

  // ───────── SERVICE WORKER ─────────
  var status = document.getElementById("status");
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(){
      return navigator.serviceWorker.ready;
    }).then(function(){
      status.textContent = "OFFLINE READY"; status.className = "pill ok";
    }).catch(function(){

        if(navigator.clipboard && navigator.clipboard.writeText){

  // ═══════════ 3) TIME REMAINING ═══════════
  (function(){
    var C = mkCard("Time Remaining");
    var land = inp({ inputmode: "numeric", maxlength: "4", placeholder: "---" });
    var cur  = inp({ inputmode: "numeric", maxlength: "4", placeholder: "---" });
    var row = el("div", "row2");
    row.appendChild(field("Planned landing (UTC)", land));
    row.appendChild(field("Current time (UTC)", cur));
    C.body.appendChild(row);
    var liveBtn = el("button", "btn big", "Use current UTC");
    C.body.appendChild(liveBtn);
    var out = tile("neu", "Time remaining");
    C.body.appendChild(out);
    var msg = el("div", "msg"); msg.hidden = true; C.body.appendChild(msg);
    var note = el("div", "hint"); note.hidden = true; C.body.appendChild(note);

    function parse(s){
      if(!/^\d{4}$/.test(s)) return null;
      var h = +s.slice(0, 2), m = +s.slice(2);
      return (h <= 23 && m <= 59) ? h * 60 + m : null;
    }
    function compute(){
      var a = land.value, b = cur.value, bad = [];
      var L = parse(a), N = parse(b);
      if(a && L === null) bad.push("Landing time");
      if(b && N === null) bad.push("Current time");
      msg.hidden = !bad.length;
      if(bad.length) msg.textContent = bad.join(" and ") + ": enter 4 digits HHMM (hour 00-23, minute 00-59).";
      note.hidden = true;
      if(L === null || N === null){ out.v.textContent = "--"; return; }
      var diff = L - N;
      if(diff < 0){
        diff += 1440;
        note.textContent = "Landing time is earlier than the current time: assuming landing is after midnight UTC (+24 h).";
        note.hidden = false;
      }
      out.v.textContent = Math.floor(diff / 60) + "+" + pad2(diff % 60);
    }
    function utcNow(){ var d = new Date(); return pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()); }

    var timer = null;
    function tick(){
      var v = utcNow();
      if(v !== cur.value){ cur.value = v; compute(); }
    }
    function startLive(){
      cur.value = utcNow(); compute();
      liveBtn.textContent = "Stop live";
      liveBtn.classList.add("on");
      if(timer) clearInterval(timer);
      timer = setInterval(tick, 10000);
    }
    function stopLive(){
      if(timer){ clearInterval(timer); timer = null; }
      liveBtn.textContent = "Use current UTC";
      liveBtn.classList.remove("on");
    }
    function digits(i){ i.addEventListener("input", function(){ var v = i.value.replace(/\D/g, "").slice(0, 4); if(v !== i.value) i.value = v; }); }
    digits(land); digits(cur);
    land.addEventListener("input", compute);
    cur.addEventListener("input", function(){ if(timer) stopLive(); compute(); });
    cur.addEventListener("beforeinput", function(){ if(timer) stopLive(); });
    cur.addEventListener("keydown", function(e){ if(timer && e.key !== "Tab" && e.key !== "Shift") stopLive(); });
    liveBtn.addEventListener("click", function(){ if(timer) stopLive(); else startLive(); });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden && timer) tick(); });
    compute();
    resetters.push(function(){ stopLive(); land.value = ""; cur.value = ""; compute(); });
    viewIn.appendChild(C.wrap);
  })();

        if(ok) return true;
        return navigator.storage.persist ? navigator.storage.persist() : false;
      }).then(function(ok){
        stoSt.textContent = ok ? "Storage: protected. This device will keep your entries." : "Storage: not guaranteed. Add the app to your Home Screen so the device keeps your entries.";
      }).catch(function(){});
    }catch(e){}
  }
  stoCheck();
  wipeBtn.addEventListener("click", function(){
    if(!window.confirm("Clear ALL data on this device?\n\nThis deletes every entry, the saved flight plan PDFs, recent flights and settings (including airplane, ETOPS and theme). It cannot be undone. The app itself stays installed and works offline.")) return;
    try{ localStorage.clear(); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    var done = function(){ location.reload(); };
    try{
      var rq = indexedDB.deleteDatabase("navlog-pdf");
      rq.onsuccess = rq.onerror = rq.onblocked = done;
      setTimeout(done, 1500);
    }catch(e){ done(); }
  });
  viewPre.appendChild(newFlt);
  resetBtn.addEventListener("click", function(){
    if(!window.confirm("Reset ALL for a new flight?\n\nThis clears the ORCA checks, flight number, route and times, FMS data, critical fuel, FMC EO values, HF frequencies, fuel ladder, bingo fuel, time fields and the loaded Nav Log with its ATA and fuel entries.\n\nAirplane and ETOPS selections are kept.")) return;
    if(window.orcaResetChecks) window.orcaResetChecks();
    resetters.forEach(function(f){ try{ f(); }catch(e){} });
    try{ if(navMounted) window.NavLog.reset(); }catch(e){}
    try{ indexedDB.deleteDatabase("navlog-pdf"); }catch(e){}
    try{ localStorage.removeItem(PLAN_KEY); }catch(e){} flightRef.planDist = ""; flightRef.planTime = ""; if(window.preRenderRoute) window.preRenderRoute();
    ofpSt.className = "ofps"; ofpSt.textContent = "Load the United OFP PDF here or in the Nav Log tab. It is read on this device and never uploaded. Flight, times, fuel ladder and ETOPS fill in here; FMS data you type yourself as a cross-check.";
    refreshStale();
  });

  (function(){
    var PG_KEY = "orca_etops_pg", pg = lsGet(PG_KEY) === "rings" ? "rings" : "fuel";
    var bF = el("button", "btn big", "Fuel Analysis"), bR = el("button", "btn big", "ETOPS Rings");
    var bO = el("button", "btn big", "ORCA Checklist"); bO.setAttribute("aria-pressed", "false");
    etpNav.appendChild(bF); etpNav.appendChild(bR); etpNav.appendChild(bO);
    // The same three buttons sit at the top of the ORCA checklist so you can get back.
    var oNav = el("div", "etpnav"); oNav.style.cssText = "padding:8px 10px 0";
    var oF = el("button", "btn big", "Fuel Analysis"), oR = el("button", "btn big", "ETOPS Rings"), oO = el("button", "btn big", "ORCA Checklist");
    oO.setAttribute("aria-pressed", "true"); oF.setAttribute("aria-pressed", "false"); oR.setAttribute("aria-pressed", "false");
    oNav.appendChild(oF); oNav.appendChild(oR); oNav.appendChild(oO);
    var vo = $("view-orca"); vo.insertBefore(oNav, vo.firstChild);
    viewNew.appendChild(etpNav); viewNew.appendChild(etpFuel); viewNew.appendChild(etpRings);
    function showPg(p, save){
      pg = p;
      etpFuel.hidden = (p !== "fuel"); etpRings.hidden = (p !== "rings");
      bF.classList.toggle("on", p === "fuel"); bR.classList.toggle("on", p === "rings");
      bF.setAttribute("aria-pressed", p === "fuel" ? "true" : "false");
      bR.setAttribute("aria-pressed", p === "rings" ? "true" : "false");
      if(save) lsSet(PG_KEY, p);
    }
    bF.addEventListener("click", function(){ showPg("fuel", true); });
    bR.addEventListener("click", function(){ showPg("rings", true); });
    bO.addEventListener("click", function(){ showView("orca", true); });
    oF.addEventListener("click", function(){ showPg("fuel", true); showView("new", true); });
    oR.addEventListener("click", function(){ showPg("rings", true); showView("new", true); });
    showPg(pg, false);
  })();

  var start = lsGet(NAV_KEY);
  if(!views[start]) start = "pre";
  showView(start, false);
})();
</script>

<script>
(function(){
  var G = [
    ["Preflight", "nav-pre", [["Flight","PDF, times, brief cards"],["FMS Data","you type, self-check"],["Differences","757/767 card"]]],
    ["Nav Log", "nav-nav", [["Brief","brief"],["Nav Log","nav"],["Fuel","fuel"],["Route","route"],["ETOPS","etops"]]],
    ["Fuel", "nav-fuel", [["Fuel Ladder",""],["Bingo",""]]],
    ["ETOPS", "nav-new", [["Fuel Analysis",""],["ETOPS Rings",""],["ORCA Checklist",""]]],
    ["Inflight", "nav-in", [["Time Remaining",""],["HF Frequencies",""]]]
  ];
  var VIEW = { "nav-pre": "view-pre", "nav-nav": "view-nav", "nav-fuel": "view-fuel", "nav-new": "view-new", "nav-in": "view-in" };
  var ov = document.createElement("div"); ov.id = "idxov"; ov.hidden = true; document.body.appendChild(ov);
  function navRoot(){ var h = document.getElementById("view-nav"); return h && h.shadowRoot; }
  function navTab(k){ var r = navRoot(); return r && r.querySelector('#tabs button[data-tab="' + k + '"]'); }
  function close(){ ov.hidden = true; }
  function vis(e){ return e.offsetParent !== null; }
  function go(tabId, label, key){
    close();
    document.getElementById(tabId).click();
    setTimeout(function(){
      var view = document.getElementById(VIEW[tabId]);
      if(tabId === "nav-nav"){ var b = navTab(key); if(b) b.click(); return; }
      if(tabId === "nav-in"){
        var all = view.querySelectorAll("*"), t = label.toLowerCase();
        for(var i = 0; i < all.length; i++){ if(all[i].children.length === 0 && all[i].textContent.trim().toLowerCase() === t){ all[i].scrollIntoView({ block: "start" }); break; } }
        return;
      }
      var bs = view.querySelectorAll("button"), tl = label.toLowerCase();
      for(var j = 0; j < bs.length; j++) if(bs[j].textContent.trim().toLowerCase() === tl && vis(bs[j])){ bs[j].click(); break; }
    }, 60);
  }
  function build(){
    var cur = ""; Object.keys(VIEW).forEach(function(k){ var e = document.getElementById(k); if(e && e.getAttribute("aria-selected") === "true") cur = k; });
    var h = '<div class="sheet"><button class="xb" id="idxX">&#10005;</button><h2>Index</h2><p class="sub">Tap any page to go straight to it.</p>';
    G.forEach(function(g){
      h += '<div class="grp"><span>' + g[0] + '</span>' + (g[1] === cur ? '<b>&#9679; you are here</b>' : '') + '</div><div class="row">';
      g[2].forEach(function(it){
        var dis = g[1] === "nav-nav" && !navTab(it[1]);
        h += '<button class="it" data-tab="' + g[1] + '" data-label="' + it[0] + '" data-key="' + (g[1] === "nav-nav" ? it[1] : "") + '"' + (dis ? " disabled" : "") + '>' + it[0] + (g[1] === "nav-pre" ? '<small>' + it[1] + '</small>' : '') + '</button>';
      });
      h += '</div>';
    });
    if(!navTab("nav")) h += '<p class="sub" style="margin-top:12px">Nav Log pages are available once a flight plan PDF is loaded.</p>';
    ov.innerHTML = h + '</div>';
  }
  document.getElementById("idxBtn").addEventListener("click", function(){ build(); ov.hidden = false; });
  ov.addEventListener("click", function(e){
    if(e.target === ov || e.target.id === "idxX") return close();
    var b = e.target.closest && e.target.closest(".it"); if(b && !b.disabled) go(b.dataset.tab, b.dataset.label, b.dataset.key);
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });
})();
</script>
</body>
</html>
